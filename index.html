<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trabalho de Física</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
        }

        li {
            background: #e8eefc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 18px;
        }

        footer {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Trabalho de Física</h1>
        <p>Materiais utilizados no projeto</p>
    </header>

    <main>

        <section class="card">
            <h2>Materiais utilizados</h2>

            <ul>
                <li>🟦 Fita</li>
                <li>🔪 Estilete</li>
                <li>🔫 Cola Quente</li>
                <li>📦 Caixas de Papelão</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>Trabalho de Física - 2026</p>
    </footer>

</body>
</html>
